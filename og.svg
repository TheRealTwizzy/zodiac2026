<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Cosmic Atlas — the zodiac wheel and its aspect geometry">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#161c46"/>
      <stop offset="55%" stop-color="#0a0e2a"/>
      <stop offset="100%" stop-color="#03040c"/>
    </radialGradient>
    <radialGradient id="hub" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#06081a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#d6c9ff"/>
      <stop offset="100%" stop-color="#8fd8ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- scattered stars -->
  <g fill="#ffffff">
    <circle cx="70" cy="80" r="1.6" opacity=".7"/><circle cx="180" cy="46" r="1.1" opacity=".5"/>
    <circle cx="300" cy="120" r="1.8" opacity=".6"/><circle cx="95" cy="250" r="1.2" opacity=".45"/>
    <circle cx="150" cy="430" r="1.7" opacity=".6"/><circle cx="60" cy="540" r="1.3" opacity=".5"/>
    <circle cx="255" cy="565" r="1.5" opacity=".55"/><circle cx="1130" cy="90" r="1.7" opacity=".65"/>
    <circle cx="1050" cy="180" r="1.2" opacity=".45"/><circle cx="1160" cy="330" r="1.6" opacity=".6"/>
    <circle cx="1090" cy="470" r="1.3" opacity=".5"/><circle cx="990" cy="560" r="1.5" opacity=".55"/>
    <circle cx="640" cy="40" r="1.2" opacity=".4"/><circle cx="410" cy="590" r="1.4" opacity=".5"/>
    <circle cx="830" cy="600" r="1.2" opacity=".45"/>
  </g>

  <!-- wheel -->
  <g transform="translate(315,315)">
    <circle r="250" fill="url(#hub)"/>
    <circle r="248" fill="none" stroke="rgba(160,175,255,.22)" stroke-width="1.5"/>
    <circle r="208" fill="none" stroke="rgba(160,175,255,.18)" stroke-width="1.5"/>
    <circle r="96"  fill="rgba(6,8,22,.55)" stroke="rgba(160,175,255,.2)" stroke-width="1.5"/>

    <!-- twelve 30° spokes -->
    <g stroke="rgba(160,175,255,.22)" stroke-width="1">
      <line x1="208" y1="0" x2="248" y2="0" transform="rotate(0)"/>
      <line x1="208" y1="0" x2="248" y2="0" transform="rotate(30)"/>
      <line x1="208" y1="0" x2="248" y2="0" transform="rotate(60)"/>
      <line x1="208" y1="0" x2="248" y2="0" transform="rotate(90)"/>
      <line x1="208" y1="0" x2="248" y2="0" transform="rotate(120)"/>
      <line x1="208" y1="0" x2="248" y2="0" transform="rotate(150)"/>
      <line x1="208" y1="0" x2="248" y2="0" transform="rotate(180)"/>
      <line x1="208" y1="0" x2="248" y2="0" transform="rotate(210)"/>
      <line x1="208" y1="0" x2="248" y2="0" transform="rotate(240)"/>
      <line x1="208" y1="0" x2="248" y2="0" transform="rotate(270)"/>
      <line x1="208" y1="0" x2="248" y2="0" transform="rotate(300)"/>
      <line x1="208" y1="0" x2="248" y2="0" transform="rotate(330)"/>
    </g>

    <!-- fire trine (120°) -->
    <polygon points="208,0 -104,180.13 -104,-180.13" fill="none"
             stroke="#ff5f45" stroke-width="2.4" opacity=".85"/>
    <!-- cardinal square (90°) -->
    <polygon points="0,-208 208,0 0,208 -208,0" fill="none"
             stroke="#ff6fc4" stroke-width="1.8" opacity=".55"/>
    <!-- an axis (180°) -->
    <line x1="-180.13" y1="-104" x2="180.13" y2="104"
          stroke="#63d3ff" stroke-width="1.8" opacity=".6"/>

    <!-- sign nodes -->
    <g>
      <circle cx="228" cy="0" r="11" fill="#ff5f45"/>
      <circle cx="197.45" cy="114" r="9" fill="#3fdc8b"/>
      <circle cx="114" cy="197.45" r="9" fill="#ffd35e"/>
      <circle cx="0" cy="228" r="9" fill="#4fb6ff"/>
      <circle cx="-114" cy="197.45" r="11" fill="#ff5f45"/>
      <circle cx="-197.45" cy="114" r="9" fill="#3fdc8b"/>
      <circle cx="-228" cy="0" r="9" fill="#ffd35e"/>
      <circle cx="-197.45" cy="-114" r="9" fill="#4fb6ff"/>
      <circle cx="-114" cy="-197.45" r="11" fill="#ff5f45"/>
      <circle cx="0" cy="-228" r="9" fill="#3fdc8b"/>
      <circle cx="114" cy="-197.45" r="9" fill="#ffd35e"/>
      <circle cx="197.45" cy="-114" r="9" fill="#4fb6ff"/>
    </g>

    <text x="0" y="14" text-anchor="middle" font-size="42"
          fill="#a78bfa" font-family="Segoe UI Symbol, Apple Symbols, serif">✶</text>
  </g>

  <!-- wordmark -->
  <g transform="translate(650,220)">
    <text x="0" y="0" font-size="66" font-weight="700" fill="url(#ttl)"
          font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Cosmic Atlas</text>
    <text x="0" y="52" font-size="25" fill="#c4caf0" letter-spacing="0.5"
          font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">The zodiac, explained properly</text>
    <text x="0" y="116" font-size="20" fill="#8b93c4"
          font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Twelve signs · sixteen bodies · twelve houses</text>
    <text x="0" y="148" font-size="20" fill="#8b93c4"
          font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">and the real geometry underneath them.</text>
    <text x="0" y="204" font-size="18" fill="#3fdc8b"
          font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">No horoscopes. No predictions.</text>
  </g>
</svg>
